<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CutiePie Name Necklace Hamper | Order Now</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #fff5f7; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        img { width: 100%; border-radius: 10px; }
        h1 { color: #d63384; font-size: 24px; margin-bottom: 10px; }
        .price { font-size: 22px; color: #28a745; font-weight: bold; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; background-color: #25D366; color: white; border: none; padding: 15px; font-size: 18px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #128C7E; }
        .details { font-size: 14px; color: #666; line-height: 1.6; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <img src="https://via.placeholder.com/500x500.png?text=Necklace+Hamper+Image" alt="CutiePie Necklace">
    <h1>CutiePie Name Necklace Hamper</h1>
    <p class="details">
        A beautiful personalized gift for your loved ones. Includes a custom name necklace and a premium gift box.
    </p>
    <div class="price">Price: ₹999.00</div>

    <hr>

    <h3>Enter Order Details</h3>
    <div class="form-group">
        <label>Name to be Printed on Necklace:</label>
        <input type="text" id="custName" placeholder="e.g. Priya" required>
    </div>
    <div class="form-group">
        <label>Your Full Name:</label>
        <input type="text" id="buyerName" required>
    </div>
    <div class="form-group">
        <label>Full Delivery Address:</label>
        <textarea id="address" rows="3" required></textarea>
    </div>
    <div class="form-group">
        <label>Phone Number:</label>
        <input type="tel" id="phone" required>
    </div>

    <button onclick="sendToWhatsApp()">Book Order via WhatsApp</button>
</div>

<script>
    function sendToWhatsApp() {
        const phoneNumber = "917678420115"; // Aapka number
        
        // Form Data
        const necklaceName = document.getElementById('custName').value;
        const buyerName = document.getElementById('buyerName').value;
        const address = document.getElementById('address').value;
        const phone = document.getElementById('phone').value;

        if(!necklaceName || !buyerName || !address || !phone) {
            alert("Please fill all details!");
            return;
        }

        // Message Formatting
        const message = `*NEW ORDER RECEIVED*%0A%0A` +
                        `*Product:* CutiePie Name Necklace Hamper%0A` +
                        `*Name on Necklace:* ${necklaceName}%0A` +
                        `--------------------------%0A` +
                        `*Customer Name:* ${buyerName}%0A` +
                        `*Phone:* ${phone}%0A` +
                        `*Address:* ${address}%0A%0A` +
                        `Please confirm my order.`;

        // Redirect to WhatsApp
        const url = `https://wa.me/${phoneNumber}?text=${message}`;
        window.open(url, '_blank');
    }
</script>

</body>
</html>
